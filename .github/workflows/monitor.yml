name: Monitor Latvijas Pasts

on:
  # Run once every day.
  schedule:
    - cron: "17 6 * * *"

  # Allow you to run it manually from the GitHub Actions page.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # ================================================================
      # CHECK OUT REPOSITORY
      # ================================================================
      - name: Check out repository
        uses: actions/checkout@v5

      # ================================================================
      # SET UP PYTHON
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      # ================================================================
      # INSTALL DEPENDENCIES
      # ================================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ================================================================
      # RUN MONITOR
      # ================================================================
      - name: Run Latvijas Pasts monitor
        run: |
          python monitor_latvia.py

      # ================================================================
      # SHOW RESULT
      # ================================================================
      - name: Display output_latvia
        run: |
          echo "=================================================="
          echo "Generated output_latvia:"
          echo "=================================================="
          cat output_latvia
          echo "=================================================="

      # ================================================================
      # COMMIT ONLY IF THE OUTPUT CHANGED
      # ================================================================
      - name: Commit changed output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output_latvia

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Latvijas Pasts suspension data"
          git push
